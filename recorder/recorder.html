<!doctype html>
<html>
<head><meta charset="utf-8"><title>Recorder</title><link rel="stylesheet" href="../popup/popup.css"><style>body{width:auto}</style></head>
<body>
  <main class="app">
    <header><div><h1>Screen Recorder</h1><p id="status">Choose what to record…</p></div></header>
    <section id="controls" class="controls hidden">
      <span id="timer">00:00</span>
      <button id="pause">Pause</button>
      <button id="stop">Stop</button>
    </section>
    <div id="message" class="message">Keep this window open while recording. You can minimise it.</div>
  </main>
<script type="module" src="recorder.js"></script>
</body>
</html>
