<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recorder</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main class="app">
    <header><div><h1>Screen Recorder</h1><p id="status">Ready</p></div><button id="settings" class="icon">⚙</button></header>
    <section class="drive"><span>☁️ Google Drive</span><span id="driveStatus">Checking…</span></section>
    <button id="connect" class="secondary">Connect Google Drive</button>
    <button id="record" class="primary">🔴 Record Screen</button>
    <button id="screenshot" class="secondary">📸 Screenshot</button>
    <section id="recordingControls" class="controls hidden">
      <span id="timer">00:00</span>
      <button id="pause">Pause</button>
      <button id="stop">Stop</button>
    </section>
    <div id="message" class="message"></div>
  </main>
<script src="popup.js"></script>
</body>
</html>
